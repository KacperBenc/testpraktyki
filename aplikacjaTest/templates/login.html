{% extends "base.html" %}
{% load static %}

{% block title %}
Logowanie – System Praktyk
{% endblock title %}

{% block breadcrumb %}{% endblock breadcrumb %}
{% block main_title %}{% endblock main_title %}

{% block content %}
<div class="row m-0 p-0 d-flex justify-content-center">
    <div class="main-content col-12 col-sm-6">

        <img src="{% static 'aplikacjaTest/images/logo_pl.png' %}" id="logo" alt="" aria-hidden="true">


        <div id="content" class="login">
            <div class="form edgeless">
                <form method="POST" id="fm1">
                    {% csrf_token %}
                    <div class="new-input">
                        <input type="text" id="login" placeholder=" " title="Identyfikator" name="login" required>
                        <label for="login">Identyfikator</label>
                    </div>
                    <div class="new-input">
                        <input type="password" id="haslo" placeholder=" " title="Hasło" name="haslo" required>
                        <label for="haslo">Hasło</label>
                    </div>

                    <div class="form-button-row">
                        <div class="submit-row">
                            <div class="submit-button">
                                <button class="form-button" name="submit" type="submit">
                                    Zaloguj się
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div class="link-box m-3">
                Nie masz konta?
                <a href="{% url 'rejestracja' %}">Zarejestruj się</a>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
