<h2>Logowanie</h2>

<style>
form {
    width: 350px;
    margin: auto;
    padding: 20px;
    border: 1px solid #aaa;
    border-radius: 8px;
    background: #f9f9f9;
}
input {
    width: 100%;
    padding: 8px;
    margin: 6px 0 14px;
}
button {
    padding: 10px;
    width: 100%;
}
</style>

{% if messages %}
    {% for msg in messages %}
        <p style="color:red;">{{ msg }}</p>
    {% endfor %}
{% endif %}

<form method="POST">
    {% csrf_token %}

    <label for="login">Login:</label>
    <input type="text" name="login" required>

    <label for="haslo">Hasło:</label>
    <input type="password" name="haslo" required>

    <button type="submit">Zaloguj</button>
</form>
