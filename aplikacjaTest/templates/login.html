<!DOCTYPE html>
<html lang="pl">
<head>
  <title>{% block title %}{% endblock %}</title>
  {% load bootstrap5 %}
  {% load static %}
  {% bootstrap_css %}
  {% bootstrap_javascript %}
  <link rel="stylesheet" href="{% static '/styles/styles.css' %}" type="text/css">
</head>
<body class="login">
    <header id="header">
        <div id="header-content">
            <div class="expandable">
                <a href="./login">Logowanie</a>
            </div>
        </div>
    </header>

    <main id="container">
        <img src="{% static '/images/logo_pl.png' %}" id="logo" alt="" aria-hidden="true">
        <div id="content" class="content">
            <div class="message">
                <div class="message-body"></div>
            </div>

            <div class="form edgeless">
                <form method="POST" id="fm1">
                    {% csrf_token %}
                    <div class="new-input">
                        <input type="text" id="login" title="Identyfikator" name="login" value="" required>
                        <label for="login">Identyfikator</label>
                    </div>
                    <div class="new-input">
                        <input type="password" id="haslo"  title="Hasło" name="haslo" required
                               value=""><label for="haslo">Hasło</label>
                    </div>
                    {% if messages %}
                        {% for msg in messages %}
                            <div class="error fade show">
                                <p class="be-message">{{ msg }}</p>
                            </div>
                        {% endfor %}
                    {% endif %}
                    <div class="form-button-row">
                        <div class="submit-row">
                            <div class="submit-button">
                                <div>
                                    <button class="form-button" name="submit" type="submit">
                                        Zaloguj się
                                    </button>

                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div class="link-box m-3">
                Nie masz konta?
                <a href="{% url 'rejestracja' %}">Zarejestruj się</a>
            </div>

        </div>
    </main>
</body>
</html>
