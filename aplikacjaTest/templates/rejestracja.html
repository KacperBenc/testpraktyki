<h2>Rejestracja</h2>

<form method="POST">
    {% csrf_token %}

    <h3>Dane użytkownika</h3>
    {{ form.as_p }}

  <div id="adres_fields" style="display:none;">
    <h3>Adres</h3>
    {{ adres_form.as_p }}
</div>
    <!-- STUDENT -->
    <div id="student_fields" style="display:none;">
        <h3>Dane studenta</h3>
        {{ student_form.as_p }}
    </div>

    <!-- OPIEKUN -->
    <div id="opiekun_fields" style="display:none;">
        <h3>Dane opiekuna</h3>
        {{ opiekun_form.as_p }}
    </div>

    <!-- PRACODAWCA -->
    <div id="pracodawca_fields" style="display:none;">
        <h3>Dane pracodawcy</h3>
        {{ pracodawca_form.as_p }}
    </div>

    <!-- PRACOWNIK BK -->
    <div id="pracownikbk_fields" style="display:none;">
        <h3>Dane pracownika BK</h3>
        {{ pracownikbk_form.as_p }}
    </div>

    <button type="submit">Zarejestruj</button>
</form>

<script>
function updateRoleFields() {
    const role = document.getElementById("id_rola").value;

    // Ukryj wszystko
    document.getElementById("student_fields").style.display = "none";
    document.getElementById("opiekun_fields").style.display = "none";
    document.getElementById("pracodawca_fields").style.display = "none";
    document.getElementById("pracownikbk_fields").style.display = "none";

    document.getElementById("adres_fields").style.display = "none"; // <- adres domyślnie ukryty

    // Pokazujemy sekcje zależnie od roli
    if (role === "Student") {
        document.getElementById("student_fields").style.display = "block";
        document.getElementById("adres_fields").style.display = "block";   // Student wymaga adresu
    }
    else if (role === "Opiekun Praktyk") {
        document.getElementById("opiekun_fields").style.display = "block";
    }
    else if (role === "Pracodawca") {
        document.getElementById("pracodawca_fields").style.display = "block";
        document.getElementById("adres_fields").style.display = "block";   // Pracodawca wymaga adresu
    }
    else if (role === "Pracownik BK") {
        document.getElementById("pracownikbk_fields").style.display = "block";
    }
}

document.addEventListener("DOMContentLoaded", updateRoleFields);
document.getElementById("id_rola").addEventListener("change", updateRoleFields);
</script>
