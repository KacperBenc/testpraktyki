{% extends "base.html" %}

{% block content %}
    <h1>Zgłoszenie na praktyki</h1>

    {% if form.errors %}
        <div>
            <p>Formularz zawiera błędy. Popraw je proszę:</p>
            {{ form.errors }}
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Wyślij zgłoszenie</button>
    </form>
{% endblock %}l>
